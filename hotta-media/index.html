<style>
.hm-media{--ink:#16181d;--sub:#6b7280;--line:#e7e8ec;--soft:#f6f6f4;--accent:#d9482b;background:#fff;color:var(--ink);max-width:1120px;margin:0 auto;padding:56px 20px 80px;line-height:1.7;box-sizing:border-box;text-align:left;width:100%;}
.hm-media *{box-sizing:border-box;min-width:0;}
.hm-media a{color:inherit;text-decoration:none;}
.hm-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:28px;border-bottom:1px solid var(--ink);}
.hm-eyebrow{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:15px;letter-spacing:.14em;color:var(--accent);}
.hm-media .hm-title{margin:0;padding:0;border:0;font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:.04em;line-height:1.25;color:var(--ink);}
.hm-lead{margin:14px 0 0;font-size:15px;color:var(--sub);max-width:34em;}
.hm-stat{display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
.hm-stat b{font-family:Georgia,"Times New Roman",serif;font-size:clamp(52px,8vw,84px);font-weight:400;line-height:1;letter-spacing:-.02em;}
.hm-stat span{font-size:13px;color:var(--sub);letter-spacing:.08em;}
.hm-tools{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin:26px 0 8px;}
.hm-media .hm-search{flex:1 1 260px;min-width:0;height:46px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s,background .2s;}
.hm-media .hm-search:focus{border-color:var(--ink);background:#fff;}
.hm-years{display:flex;flex-wrap:wrap;gap:8px;}
.hm-media .hm-chip{appearance:none;cursor:pointer;height:36px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:13px;letter-spacing:.06em;color:var(--sub);transition:all .2s;}
.hm-media .hm-chip:hover{border-color:var(--ink);color:var(--ink);}
.hm-media .hm-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
.hm-year{display:flex;align-items:center;gap:16px;margin:48px 0 22px;}
.hm-year b{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:400;line-height:1;}
.hm-year i{flex:1;height:1px;background:var(--line);}
.hm-year span{font-size:12px;font-style:normal;color:var(--sub);letter-spacing:.1em;}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:34px 26px;width:100%;}
.hm-card{display:block;min-width:0;max-width:100%;}
.hm-thumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:var(--soft);}
.hm-media .hm-thumb img{display:block;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;object-fit:cover;transition:transform .5s ease;}
.hm-card:hover .hm-thumb img{transform:scale(1.045);}
.hm-noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:.18em;color:#9aa0aa;}
.hm-play{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;transition:background .2s;}
.hm-play::before{content:"";margin-left:3px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--ink);transition:border-color .2s;}
.hm-card:hover .hm-play{background:var(--accent);}
.hm-card:hover .hm-play::before{border-left-color:#fff;}
.hm-date{display:block;margin:14px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:13px;letter-spacing:.08em;color:var(--accent);}
.hm-name{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:700;line-height:1.6;color:var(--ink);overflow-wrap:anywhere;word-break:break-word;}
.hm-card:hover .hm-name{text-decoration:underline;text-underline-offset:4px;}
.hm-ch{display:block;max-width:100%;margin-top:8px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-empty{margin:56px 0;text-align:center;color:var(--sub);font-size:15px;}
.hm-warn{margin:20px 0;padding:12px 16px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-size:13px;}
@media (max-width:600px){.hm-media{padding:36px 16px 56px;}.hm-grid{grid-template-columns:minmax(0,1fr);gap:28px;}.hm-stat b{font-size:52px;}.hm-year{margin-top:38px;}}
</style>
<section class="hm-media" id="hm-media">
<header class="hm-head">
<div>
<p class="hm-eyebrow">Media Appearances</p>
<h1 class="hm-title">メディア出演情報</h1>
<p class="hm-lead">YouTubeなどで公開されている出演動画の一覧です。番組名やキーワードで検索できます。</p>
</div>
<div class="hm-stat"><b id="hm-count">0</b><span>本の動画</span></div>
</header>
<div class="hm-tools">
<input class="hm-search" id="hm-search" type="search" placeholder="タイトルやチャンネル名で検索" aria-label="出演動画を検索">
<div class="hm-years" id="hm-years"></div>
</div>
<div id="hm-list"></div>
</section>
<script>
(function(){
var raw=document.getElementById('hm-media-data').textContent;
var lines=raw.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){if(s===''){return false;}return !/^[-ー―＿_=＝*＊]+$/.test(s);});
var YT=/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/;
function pad(n){return ('0'+n).slice(-2);}
function makeItem(d,t,c,u){
if(!/^\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}$/.test(d)){return null;}
var em=u.match(/youtube(?:-nocookie)?\.com\/embed\/([\w-]{11})/);
if(em){u='https://www.youtube.com/watch?v='+em[1];}else{var um=u.match(/https?:\/\/[^\s"'<>]+/);u=um?um[0]:'';}
if(u===''){return null;}
var p=d.split(/[-\/.]/);var m=u.match(YT);
return {y:p[0],key:p[0]+pad(p[1])+pad(p[2]),label:p[0]+'.'+pad(p[1])+'.'+pad(p[2]),t:t,c:c,u:u,id:m?m[1]:''};
}
var items=[];var broken=0;var where='';
var n=Math.floor(lines.length/4);
Array.from({length:n}).forEach(function(_,k){
var it=makeItem(lines[k*4],lines[k*4+1],lines[k*4+2],lines[k*4+3]);
if(it){items.push(it);return;}
broken++;if(where===''){where=lines[k*4].slice(0,40);}
});
if(lines.length%4!==0){broken++;}
function sortItems(){items.sort(function(a,b){return a.key===b.key?0:(a.key>b.key?-1:1);});}
sortItems();
var list=document.getElementById('hm-list');
var search=document.getElementById('hm-search');
var yearsBox=document.getElementById('hm-years');
var count=document.getElementById('hm-count');
var year='all';
function el(tag,cls,text){var e=document.createElement(tag);if(cls){e.className=cls;}if(text){e.textContent=text;}return e;}
function buildYears(){
yearsBox.textContent='';
var years=[];items.forEach(function(it){if(years.indexOf(it.y)===-1){years.push(it.y);}});
[['all','すべて']].concat(years.map(function(y){return [y,y];})).forEach(function(pair){
var b=el('button','hm-chip',pair[1]);b.type='button';b.setAttribute('aria-pressed',pair[0]===year?'true':'false');
b.addEventListener('click',function(){year=pair[0];Array.prototype.forEach.call(yearsBox.children,function(x){x.setAttribute('aria-pressed','false');});b.setAttribute('aria-pressed','true');render();});
yearsBox.appendChild(b);});
}
function render(){
var q=search.value.trim().toLowerCase();
var shown=items.filter(function(it){
if(year!=='all'){if(it.y!==year){return false;}}
if(q===''){return true;}
return (it.t+' '+it.c).toLowerCase().indexOf(q)!==-1;});
list.textContent='';
count.textContent=shown.length;
if(broken){list.appendChild(el('p','hm-warn','出演データの書き方が崩れている箇所があります。日付、タイトル、チャンネル名、URLの4行になっているかご確認ください。'+(where?'（該当箇所の先頭行：'+where+'）':'')));}
if(shown.length===0){list.appendChild(el('p','hm-empty','該当する動画が見つかりませんでした。'));return;}
var grid=null;var cur='';
shown.forEach(function(it){
if(it.y!==cur){cur=it.y;
var h=el('div','hm-year');h.appendChild(el('b','',cur));h.appendChild(el('i'));
h.appendChild(el('span','',shown.filter(function(x){return x.y===cur;}).length+'本'));
list.appendChild(h);grid=el('div','hm-grid');list.appendChild(grid);}
var a=el('a','hm-card');a.href=it.u;a.target='_blank';a.rel='noopener';
var th=el('span','hm-thumb');
if(it.id){var img=document.createElement('img');img.loading='lazy';img.alt='';img.src='https://i.ytimg.com/vi/'+it.id+'/mqdefault.jpg';th.appendChild(img);}else{th.appendChild(el('span','hm-noimg',it.u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0].split('.')[0].toUpperCase()));}
th.appendChild(el('span','hm-play'));
a.appendChild(th);a.appendChild(el('span','hm-date',it.label));a.appendChild(el('span','hm-name',it.t));a.appendChild(el('span','hm-ch',it.c));
grid.appendChild(a);});
}
search.addEventListener('input',render);
buildYears();
render();
})();
</script>
</body>
</html>
